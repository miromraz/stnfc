# Programmable-HCE test config for `stnfc emulate-apdu`.
# Reproduces a Type 4 NDEF tag entirely from rule data, so any standard
# NDEF reader (NFC Tools, TagInfo, Android beam) will see and decode the
# NDEF message. NDEF payload: a Text record "stnfc.test" (UTF-8, lang=en).

# 1) SELECT NDEF tag application (NFC Forum AID D2 76 00 00 85 01 01)
00 A4 04 00 07 D2 76 00 00 85 01 01 * : 90 00

# 2) SELECT CC file (E1 03)
00 A4 00 0C 02 E1 03 * : 90 00

# 3) SELECT NDEF file (E1 04)
00 A4 00 0C 02 E1 04 * : 90 00

# 4) READ CC (15-byte CC: v2.0, NDEF file E1 04, max 0x0FFE, read-free)
00 B0 00 00 0F : 00 0F 20 00 7F 00 7F 04 06 E1 04 0F FE 00 FF 90 00

# 5) READ NLEN (NDEF message length = 17 bytes = 0x0011)
00 B0 00 00 02 : 00 11 90 00

# 6) READ NDEF message data (offset 2, full NDEF Text record):
#    D1 01 0D 54 02 65 6E   "stnfc.test"
#    header MB|ME|SR|TNF=1, tlen=1, plen=13, type='T', status=02 (lang=2),
#    "en", then the 10 ASCII bytes.
00 B0 00 02 * : D1 01 0D 54 02 65 6E 73 74 6E 66 63 2E 74 65 73 74 90 00

# 7) Catch-all: file/app not found
* : 6A 82
